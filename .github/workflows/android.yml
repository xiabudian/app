name: 打包安卓 APK

on:
  push:
    branches: [main]
  workflow_dispatch: # 也支持在 GitHub 页面上手动触发

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 安装 Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: 安装依赖
        run: npm install

      - name: 构建网页
        run: npm run build

      - name: 同步到安卓工程
        run: npx cap sync android

      - name: 编译 Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: 上传 APK（在 Actions 页面下载）
        uses: actions/upload-artifact@v4
        with:
          name: AI聊天助手-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
