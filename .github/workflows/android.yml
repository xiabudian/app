name: 打包安卓 APK

on:
  push:
    branches: [main]
  workflow_dispatch: # 也支持在 GitHub 页面上手动触发

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 安装 Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: 安装依赖
        run: npm install

      - name: 生成版本号（提交次数 + 哈希）
        id: ver
        run: |
          echo "short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "count=$(git rev-list --count HEAD)" >> "$GITHUB_OUTPUT"

      - name: 构建网页
        run: |
          set -o pipefail
          npm run build 2>&1 | tee build.log

      - name: 写入版本标记（App 设置页显示用）
        run: printf '{"commit":"%s","build":%s}\n' "${{ steps.ver.outputs.short }}" "${{ github.run_number }}" > dist/version.json

      - name: 设置 APK 版本号
        run: |
          cd android
          sed -i "s/versionCode [0-9]*/versionCode ${{ steps.ver.outputs.count }}/" app/build.gradle
          sed -i "s/versionName \".*\"/versionName \"1.0.${{ steps.ver.outputs.count }}-${{ steps.ver.outputs.short }}\"/" app/build.gradle
          grep -n "versionCode\|versionName" app/build.gradle

      - name: 同步到安卓工程
        run: |
          set -o pipefail
          npx cap sync android 2>&1 | tee sync.log

      - name: 编译 Debug APK
        run: |
          set -o pipefail
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon 2>&1 | tee ../gradle.log

      - name: 回传构建结果（无论成败，推到 logs 分支）
        if: always()
        run: |
          git config user.email "ci@local"
          git config user.name "CI"
          mkdir -p ci-logs
          for f in build.log sync.log gradle.log; do cp -f "$f" ci-logs/ 2>/dev/null || true; done
          apk=$(ls -1 android/app/build/outputs/apk/debug 2>/dev/null | tr '\n' ' ')
          errtail=$(tail -c 800 gradle.log 2>/dev/null | tr '\n' ' ' | tr -d '\r')
          git add -A
          git commit -m "ci: 构建${{ job.status }} APK=[$apk] ERR=[$errtail]" || echo "commit 跳过（无变更）"
          git push -f origin "HEAD:refs/heads/logs" || true

      - name: 上传 APK（在 Actions 页面下载）
        uses: actions/upload-artifact@v4
        with:
          name: AI聊天助手-${{ steps.ver.outputs.short }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn
