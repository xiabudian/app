name: 打包安卓 APK

on:
  push:
    branches: [main]
  workflow_dispatch: # 也支持在 GitHub 页面上手动触发

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 安装 Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: 安装依赖
        run: npm install

      - name: 构建网页
        run: |
          set -o pipefail
          npm run build 2>&1 | tee build.log

      - name: 同步到安卓工程
        run: |
          set -o pipefail
          npx cap sync android --verbose 2>&1 | tee sync.log

      - name: 编译 Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon 2>&1 | tee ../gradle.log

      - name: 失败时回传日志（推到 logs 分支供排查）
        if: failure()
        run: |
          git config user.email "ci@local"
          git config user.name "CI"
          mkdir -p ci-logs
          cp -f build.log ci-logs/ 2>/dev/null || true
          cp -f sync.log ci-logs/ 2>/dev/null || true
          cp -f gradle.log ci-logs/ 2>/dev/null || true
          git add -A ci-logs
          git commit -m "ci: 失败日志" || echo "无日志"
          git push origin "HEAD:refs/heads/logs" || true

      - name: 上传 APK（在 Actions 页面下载）
        uses: actions/upload-artifact@v4
        with:
          name: AI聊天助手-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
