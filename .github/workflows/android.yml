name: 打包安卓 APK

on:
  push:
    branches: [main]
  workflow_dispatch: # 也支持在 GitHub 页面上手动触发

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 安装 Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: 安装依赖
        run: npm install

      - name: 构建网页
        run: |
          set -o pipefail
          npm run build 2>&1 | tee build.log

      - name: 同步到安卓工程
        run: |
          set -o pipefail
          npx cap sync android --verbose 2>&1 | tee sync.log

      - name: 编译 Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon 2>&1 | tee ../gradle.log

      - name: 失败时回传日志（强制推到 logs 分支，提交信息含报错尾部）
        if: failure()
        run: |
          git config user.email "ci@local"
          git config user.name "CI"
          mkdir -p ci-logs
          for f in build.log sync.log gradle.log; do cp -f "$f" ci-logs/ 2>/dev/null || true; done
          errtail=$(tail -c 800 sync.log 2>/dev/null | tr '\n' ' ' | tr -d '\r')
          rootls=$(ls -1 | tr '\n' ' ' | head -c 150)
          git add -A
          git commit -m "ci: 失败日志 root=[$rootls] ERR=[$errtail]" || echo "commit 跳过（无变更）"
          git push -f origin "HEAD:refs/heads/logs" || true

      - name: 上传 APK（在 Actions 页面下载）
        uses: actions/upload-artifact@v4
        with:
          name: AI聊天助手-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
